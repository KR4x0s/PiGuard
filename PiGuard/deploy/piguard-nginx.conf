server {
    listen 10.78.0.1:443 ssl;
    listen 127.0.0.1:8090;
    server_name _;
    ssl_certificate /etc/piguard-web/cert.pem;
    ssl_certificate_key /etc/piguard-web/key.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 16k;

    location = /authz/admin {
        internal;
        proxy_pass http://127.0.0.1:8080/authz/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Cookie $http_cookie;
    }
    location /pihole/ {
        auth_request /authz/admin;
        rewrite ^/pihole/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 190s;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Proto https;
    }
}
